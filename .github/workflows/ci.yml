name: ci

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  python-compatibility:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}
      - if: matrix.python-version != '3.15'
        run: uv sync --group dev
      - if: matrix.python-version == '3.15'
        run: uv sync --group dev --extra arrow --extra pandas
      - run: uv run python -c "import sys, polars; print(sys.version); print(polars.__version__)"
      - run: uv run pytest -m "not live"

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          python-version: "3.12"
      - run: uv sync --all-extras --group dev
      - uses: actions/upload-artifact@v4
        with:
          name: uv-lockfile
          path: uv.lock
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - run: uv run lint-imports
      - run: uv run pytest -m "not live"
      - run: uv run sphinx-build -W --keep-going -b html docs docs/_build/html
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: release-distributions
          path: dist/*
