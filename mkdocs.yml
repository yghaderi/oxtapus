site_name: Oxtapus
site_description: Typed, Polars-native Iranian financial market data SDK
site_url: https://yghaderi.github.io/oxtapus/
repo_url: https://github.com/yghaderi/oxtapus
strict: true
theme:
  name: material
  features:
    - navigation.sections
    - content.code.copy
plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            show_root_heading: true
markdown_extensions:
  - admonition
  - attr_list
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
nav:
  - Home: index.md
  - Getting started:
      - Installation: getting-started/installation.md
      - Quickstart: getting-started/quickstart.md
      - Jupyter: getting-started/jupyter.md
  - Concepts:
      - Architecture: concepts/architecture.md
      - Providers: concepts/providers.md
      - Data layers: concepts/data-layers.md
      - Schema versioning: concepts/schema-versioning.md
      - Instrument identifiers: concepts/instrument-identifiers.md
  - Guides:
      - Sync client: guides/sync-client.md
      - Async client: guides/async-client.md
      - Progress: guides/progress.md
      - Retries: guides/retries.md
      - Batch downloads: guides/batch-downloads.md
      - Incremental ingestion: guides/incremental-ingestion.md
      - Storage: guides/storage.md
      - Observability: guides/observability.md
  - Reference:
      - Datasets: reference/datasets.md
      - Data dictionary: reference/data-dictionary.md
      - Naming conventions: reference/naming-conventions.md
      - TSETMC endpoints: reference/tsetmc-endpoints.md
      - Configuration: reference/configuration.md
      - Exceptions: reference/exceptions.md
      - API: reference/api.md
  - Development:
      - Architecture rules: development/architecture-rules.md
      - Provider development: development/provider-development.md
      - Testing: development/testing.md
      - Current-state audit: development/current-state-audit.md
      - Reference architecture review: development/reference-architecture-review.md
      - Decisions: decisions/index.md
  - Troubleshooting: troubleshooting.md
