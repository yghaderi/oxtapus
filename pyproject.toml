[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oxtapus"
version = "1.0.0"
description = "A typed, Polars-native SDK for Iranian financial market data."
readme = "README.md"
license = { file = "LICENSE.txt" }
authors = [{ name = "Yaghoub Ghadri", email = "ghaderi.yaghoub@gmail.com" }]
requires-python = ">=3.11,<3.15"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Financial and Insurance Industry",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "httpx2>=2.12,<3",
  "polars>=1.37,<2",
  "pydantic>=2.11,<3",
  "pydantic-settings>=2.10,<3",
]

[project.optional-dependencies]
arrow = ["pyarrow>=18,<24"]
duckdb = ["duckdb>=1.3,<2"]
pandas = ["pandas>=2.2,<4"]
http2 = ["httpx2[http2]>=2.12,<3"]
docs = [
  "mkdocs-material>=9.6,<10",
  "mkdocstrings[python]>=0.30,<1",
]

[project.scripts]
oxtapus = "oxtapus.cli.app:main"

[project.urls]
Documentation = "https://yghaderi.github.io/oxtapus/"
Issues = "https://github.com/yghaderi/oxtapus/issues"
Repository = "https://github.com/yghaderi/oxtapus"

[dependency-groups]
dev = [
  "build>=1.2,<2",
  "import-linter>=2.3,<3",
  "pre-commit>=4.2,<5",
  "pyright>=1.1.405,<2",
  "pytest>=8.4,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<8",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/oxtapus"]

[tool.hatch.build.targets.sdist]
include = [
  "/src",
  "/tests",
  "/docs",
  "/scripts",
  "/README.md",
  "/CHANGELOG.md",
  "/LICENSE.txt",
  "/DATA_SOURCE_NOTICE.md",
  "/THIRD_PARTY_NOTICES.md",
  "/pyproject.toml",
  "/mkdocs.yml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "C4", "DTZ", "T20"]
ignore = ["E501"]

[tool.pyright]
include = ["src", "scripts"]
exclude = ["tests/fixtures"]
pythonVersion = "3.11"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
reportUnknownMemberType = false
reportUnknownArgumentType = false
reportUnknownVariableType = false
reportUntypedBaseClass = false

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers -ra"
testpaths = ["tests"]
markers = [
  "integration: local integration tests",
  "live: conservative tests that access live providers",
]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["oxtapus"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 80

[tool.importlinter]
root_package = "oxtapus"

[[tool.importlinter.contracts]]
name = "Domain is independent"
type = "forbidden"
source_modules = ["oxtapus.domain"]
forbidden_modules = [
  "oxtapus.api",
  "oxtapus.application",
  "oxtapus.data",
  "oxtapus.providers",
  "oxtapus.storage",
  "oxtapus.transport",
]

[[tool.importlinter.contracts]]
name = "Transport does not know financial providers"
type = "forbidden"
source_modules = ["oxtapus.transport"]
forbidden_modules = ["oxtapus.application", "oxtapus.providers", "oxtapus.storage"]

[[tool.importlinter.contracts]]
name = "Storage does not perform extraction"
type = "forbidden"
source_modules = ["oxtapus.storage"]
forbidden_modules = ["oxtapus.providers", "oxtapus.transport"]
